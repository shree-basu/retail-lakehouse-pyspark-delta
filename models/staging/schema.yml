version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [USD]
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
  - name: stg_customer_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
